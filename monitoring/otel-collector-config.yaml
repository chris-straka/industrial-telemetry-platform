receivers:
    otlp:
        protocols:
            grpc:
                endpoint: "0.0.0.0:4317"
            http:
                endpoint: "0.0.0.0:4318"

exporters:
    prometheus:
        endpoint: "0.0.0.0:8889"
    debug:
        verbosity: detailed
    otlp/tempo:
        endpoint: "tempo:4317"
        tls:
            insecure: true
    otlphttp/loki:
        endpoint: "http://loki:3100/otlp"
        tls:
            insecure: true

service:
    pipelines:
        metrics:
            receivers: [otlp]
            exporters: [prometheus, debug]
        logs:
            receivers: [otlp]
            exporters: [otlphttp/loki, debug]
        traces:
            receivers: [otlp]
            exporters: [otlp/tempo, debug]
