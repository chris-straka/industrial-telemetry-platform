stream_over_http_enabled: true
server:
    http_listen_port: 3200

distributor:
    receivers:
        otlp:
            protocols:
                grpc:
                    endpoint: 0.0.0.0:4317
                http:
                    endpoint: 0.0.0.0:4318

storage:
    trace:
        backend: local
        local:
            path: /tmp/tempo/traces
        # Compose persists /tmp/tempo. Keep the write-ahead log on the same volume so a
        # restart cannot discard traces which have not yet been flushed into local blocks.
        wal:
            path: /tmp/tempo/wal
