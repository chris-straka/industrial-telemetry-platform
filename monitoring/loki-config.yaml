auth_enabled: false

server:
    http_listen_port: 3100

common:
    instance_addr: 127.0.0.1
    path_prefix: /tmp/loki
    storage:
        filesystem:
            chunks_directory: /tmp/loki/chunks
            rules_directory: /tmp/loki/rules
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

limits_config:
  allow_structured_metadata: true
  # Demo retention budget: one week of logs. The compactor enforces it; without
  # retention_enabled the filesystem store keeps everything until the disk fills.
  retention_period: 168h

compactor:
    working_directory: /tmp/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    # The filesystem store needs an explicit delete-request store before Loki
    # accepts retention_enabled at all (flag -compactor.delete-request-store).
    delete_request_store: filesystem
