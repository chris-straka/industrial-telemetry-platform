global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

# Firing alerts go to the local Alertmanager, which routes them to MailHog.
# Prometheus retries delivery, so a brief Alertmanager restart delays rather
# than drops notifications.
alerting:
    alertmanagers:
        - static_configs:
              - targets: ["alertmanager:9093"]

rule_files:
    - /etc/prometheus/rules/*.yaml

scrape_configs:
    - job_name: "otel-collector"
      # The collector maps the OpenTelemetry service.name and service.instance.id
      # resource attributes to job and instance. Preserve those labels instead of
      # renaming them to exported_job/exported_instance at scrape time. Prometheus's
      # own generated `up` series still identifies this target as otel-collector.
      honor_labels: true
      static_configs:
          # otel-collector is docker service name
          - targets: ["otel-collector:8889"]
