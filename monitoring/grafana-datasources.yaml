apiVersion: 1
datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus_ds
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: 30s

    - name: Tempo
      type: tempo
      uid: tempo_ds
      url: http://tempo:3200
      editable: false
      jsonData:
          nodeGraph:
              enabled: true
          serviceMap:
              datasourceUid: prometheus_ds
          tracesToLogsV2:
              datasourceUid: loki_ds
              spanStartTimeShift: -1m
              spanEndTimeShift: 1m
              filterByTraceID: true
              filterBySpanID: false

    - name: Loki
      type: loki
      uid: loki_ds
      url: http://loki:3100
      editable: false
      jsonData:
          derivedFields:
              - name: TraceID
                datasourceUid: tempo_ds
                matcherType: label
                matcherRegex: trace_id
                url: "${__value.raw}"
                urlDisplayLabel: View trace
