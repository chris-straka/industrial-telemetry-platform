apiVersion: 1
datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      isDefault: true

    - name: Tempo
      type: tempo
      uid: tempo_ds
      url: http://tempo:3200

    - name: Loki
      type: loki
      url: http://loki:3100
      jsonData:
          derivedFields:
              - name: TraceID
                datasourceUid: tempo_ds
                matcherType: label
                matcherRegex: trace_id
                url: "$${__value.raw}"
