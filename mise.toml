[tools]
# Dashboards build from node:24-alpine (see src/*/Dockerfile) and vitest
# excludes odd Node 25; keep local toolchain on Node 24 LTS.
node = "24"
helm = "latest"
# Pinned so `make infra-validate` uses the same Terraform line as the
# production-plan workflow instead of failing on an unselected shim.
terraform = "1.16"
# buf: proto linting + BREAKING CHANGE detection against git history.
#      `buf breaking --against '.git#branch=main'` catches a field renumber or a
#      removed field before it ships -- the wire-compat mistake that is invisible
#      in code review. Worth a CI step.
buf = "latest"
# grpcurl: curl for gRPC. Hit StreamTelemetry by hand without writing a client.
grpcurl = "latest"
