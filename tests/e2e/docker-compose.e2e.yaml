services:
  ingestion-api:
    # E2E images use separate tags so this harness cannot replace the images used by the normal
    # development Compose project.
    image: industrialplatform-e2e-ingestion-api
    ports: !reset []
    environment:
      Kafka__ReadinessTimeoutSeconds: "3"
      # Fast trust reload so the revocation phase does not wait on the 30s default.
      TransportSecurity__AllowlistReloadIntervalSeconds: "5"

  edge-gateway:
    image: industrialplatform-e2e-edge-gateway
    ports: !reset []
    volumes:
      # Test-only: the harness posts sensor readings from inside this container, so it
      # needs one device key. Production gateways never hold device private keys.
      - sensor_tls_data:/e2e-sensor-tls:ro
    environment:
      Buffer__QuarantineRetentionHours: "168"
      Buffer__QuarantineMaxRows: "10000"
      Uploader__IdleDelayMs: "100"
      Uploader__BaseBackoffSeconds: "1"
      Uploader__MaxBackoffSeconds: "2"
      Uploader__UploadTimeoutSeconds: "3"
      SensorSecurity__Enabled: "true"
      SensorSecurity__ServerCertificatePath: /tls/server.pfx
      SensorSecurity__ServerCertificatePassword: ""
      SensorSecurity__TrustedSensorCaPath: /tls/ca.crt

  diagnostics-worker:
    image: industrialplatform-e2e-diagnostics-worker
    environment:
      # The test uses ordinary readings and never relies on a remote AI response. A non-empty
      # value is still required by startup validation.
      Gemini__ApiKey: e2e-not-a-real-key
      Kafka__DeadLetterTopic: telemetry-events-dlq
      Kafka__ReadinessTimeoutSeconds: "3"
      Consumer__BaseBackoffSeconds: "1"
      Consumer__MaxBackoffSeconds: "2"
      Outbox__IdleDelayMs: "100"
      Outbox__BaseBackoffSeconds: "1"
      Outbox__MaxBackoffSeconds: "2"
      Outbox__PublishedRetentionHours: "168"
      Outbox__MaintenanceIntervalSeconds: "5"

  postgres:
    ports: !reset []

  kafka:
    ports: !reset []

  # kafka-init is deliberately not overridden: the base command owns topics and ACLs
  # together, and splitting them would let this file silently drop authorization.
