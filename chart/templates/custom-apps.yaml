              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.ingestionApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $diagnosticsName }}
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "diagnostics-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.diagnosticsWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "diagnostics-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "diagnostics-worker") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: diagnostics-worker
          image: {{ include "industrial-platform.image" (dict "root" . "name" "diagnostics-worker") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "industrial-platform.commonEnv" (dict "root" . "serviceName" "Industrial.Diagnostics.Worker") | nindent 12 }}
            - name: ConnectionStrings__IndustrialDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platform.applicationSecret.name | quote }}
                  key: {{ .Values.platform.applicationSecret.postgresConnectionStringKey | quote }}
            - name: Kafka__BootstrapServers
              value: {{ .Values.platform.kafka.bootstrapServers | quote }}
            - name: Kafka__GroupId
              value: {{ .Values.diagnosticsWorker.kafkaGroupId | quote }}
            - name: Kafka__EventsTopic
              value: {{ .Values.platform.kafka.eventsTopic | quote }}
            - name: Kafka__AlertsTopic
              value: {{ .Values.platform.kafka.alertsTopic | quote }}
            - name: Kafka__DeadLetterTopic
              value: {{ .Values.platform.kafka.deadLetterTopic | quote }}
            - name: Kafka__ReadinessTimeoutSeconds
              value: {{ .Values.diagnosticsWorker.kafkaReadinessTimeoutSeconds | quote }}
            - name: Consumer__BaseBackoffSeconds
              value: {{ .Values.diagnosticsWorker.consumer.baseBackoffSeconds | quote }}
            - name: Consumer__MaxBackoffSeconds
              value: {{ .Values.diagnosticsWorker.consumer.maxBackoffSeconds | quote }}
            - name: Outbox__IdleDelayMs
              value: {{ .Values.diagnosticsWorker.outbox.idleDelayMs | quote }}
            - name: Outbox__BaseBackoffSeconds
              value: {{ .Values.diagnosticsWorker.outbox.baseBackoffSeconds | quote }}
            - name: Outbox__MaxBackoffSeconds
              value: {{ .Values.diagnosticsWorker.outbox.maxBackoffSeconds | quote }}
            - name: Outbox__PublishedRetentionHours
              value: {{ .Values.diagnosticsWorker.outbox.publishedRetentionHours | quote }}
            - name: Outbox__MaintenanceIntervalSeconds
              value: {{ .Values.diagnosticsWorker.outbox.maintenanceIntervalSeconds | quote }}
            - name: Gemini__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platform.applicationSecret.name | quote }}
                  key: {{ .Values.platform.applicationSecret.geminiApiKeyKey | quote }}
            - name: Gemini__Model
              value: {{ .Values.diagnosticsWorker.geminiModel | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.diagnosticsWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
