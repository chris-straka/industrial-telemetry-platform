{{- $edgeName := include "industrial-platform.appName" (dict "root" . "name" "edge-gateway") -}}
{{- $ingestionName := include "industrial-platform.appName" (dict "root" . "name" "ingestion-api") -}}
{{- $diagnosticsName := include "industrial-platform.appName" (dict "root" . "name" "diagnostics-worker") -}}
{{- $sensorName := include "industrial-platform.appName" (dict "root" . "name" "sensor-emulator") -}}
{{- $webApiName := include "industrial-platform.appName" (dict "root" . "name" "web-api") -}}
{{- $dashboardName := include "industrial-platform.appName" (dict "root" . "name" "web-dashboard") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $edgeName }}
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 4 }}
spec:
  selector:
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $edgeName }}-headless
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $edgeName }}
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 4 }}
spec:
  serviceName: {{ $edgeName }}-headless
  replicas: {{ .Values.edgeGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "edge-gateway") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: edge-gateway
          image: {{ include "industrial-platform.image" (dict "root" . "name" "edge-gateway") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "industrial-platform.commonEnv" (dict "root" . "serviceName" "Industrial.Sensor.EdgeGateway") | nindent 12 }}
            - name: Cloud__ApiUrl
              value: {{ printf "http://%s:8081" $ingestionName | quote }}
            - name: Buffer__Path
              value: /data/edge-buffer.db
            - name: Buffer__MaxDepth
              value: {{ .Values.edgeGateway.buffer.maxDepth | quote }}
            - name: Buffer__SettledIdRetentionHours
              value: {{ .Values.edgeGateway.buffer.settledIdRetentionHours | quote }}
            - name: Buffer__QuarantineRetentionHours
              value: {{ .Values.edgeGateway.buffer.quarantineRetentionHours | quote }}
            - name: Buffer__QuarantineMaxRows
              value: {{ .Values.edgeGateway.buffer.quarantineMaxRows | quote }}
            - name: Uploader__BatchSize
              value: {{ .Values.edgeGateway.uploader.batchSize | quote }}
            - name: Uploader__IdleDelayMs
              value: {{ .Values.edgeGateway.uploader.idleDelayMs | quote }}
            - name: Uploader__BaseBackoffSeconds
              value: {{ .Values.edgeGateway.uploader.baseBackoffSeconds | quote }}
            - name: Uploader__MaxBackoffSeconds
              value: {{ .Values.edgeGateway.uploader.maxBackoffSeconds | quote }}
            - name: Uploader__UploadTimeoutSeconds
              value: {{ .Values.edgeGateway.uploader.uploadTimeoutSeconds | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: buffer-data
              mountPath: /data
          {{- with .Values.edgeGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: buffer-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.edgeGateway.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.edgeGateway.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ingestionName }}
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
spec:
  selector:
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ingestionName }}
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
    {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestionApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "industrial-platform.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingestion-api
          image: {{ include "industrial-platform.image" (dict "root" . "name" "ingestion-api") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          env:
            {{- include "industrial-platform.commonEnv" (dict "root" . "serviceName" "Industrial.Ingestion.Api") | nindent 12 }}
            - name: Kafka__BootstrapServers
              value: {{ .Values.platform.kafka.bootstrapServers | quote }}
            - name: Kafka__EventsTopic
              value: {{ .Values.platform.kafka.eventsTopic | quote }}
            - name: Kafka__ReadinessTimeoutSeconds
              value: {{ .Values.ingestionApi.kafkaReadinessTimeoutSeconds | quote }}
          startupProbe:
