{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "industrial-platform.fullname" . }}-application-secrets
  labels:
    {{- include "industrial-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled=true" .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.platform.applicationSecret.name | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.platform.applicationSecret.geminiApiKeyKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.geminiApiKey.key is required when enabled" .Values.externalSecret.remoteRefs.geminiApiKey.key | quote }}
        {{- with .Values.externalSecret.remoteRefs.geminiApiKey.property }}
        property: {{ . | quote }}
        {{- end }}
    - secretKey: {{ .Values.platform.applicationSecret.postgresConnectionStringKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.postgresConnectionString.key is required when enabled" .Values.externalSecret.remoteRefs.postgresConnectionString.key | quote }}
        {{- with .Values.externalSecret.remoteRefs.postgresConnectionString.property }}
        property: {{ . | quote }}
        {{- end }}
    - secretKey: {{ .Values.platform.applicationSecret.postgresPasswordKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.postgresPassword.key is required when enabled" .Values.externalSecret.remoteRefs.postgresPassword.key | quote }}
        {{- with .Values.externalSecret.remoteRefs.postgresPassword.property }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
