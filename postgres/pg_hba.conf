# Development pg_hba: TCP requires TLS (hostssl) with SCRAM passwords; plaintext TCP
# is rejected. Container-local Unix-socket connections stay trusted so the
# healthcheck and operator `docker exec psql` keep working without a password.
# Host EF tooling connects over TCP and must use an SSL connection string (see
# `make certs` and `make db-update`).
local   all   all                                 trust
hostssl all   diagnostics   0.0.0.0/0             scram-sha-256
hostssl all   diagnostics   ::0/0                 scram-sha-256
hostssl all   admin         0.0.0.0/0             scram-sha-256
hostssl all   admin         ::0/0                 scram-sha-256
host    all   all           0.0.0.0/0             reject
host    all   all           ::0/0                 reject
