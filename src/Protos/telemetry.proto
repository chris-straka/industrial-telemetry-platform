syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Industrial.Ingestion.Api";

// For use between gateway <-> ingestion API
service TelemetryIngestion {
  // Unary
  rpc UploadTelemetry (UploadTelemetryRequest) returns (TelemetryResponse);
}

// One msg carries a whole batch of readings where max msg size is 4MiB (MaxReceiveMessageSize)
// Each reading is 142 bytes, meaning each call can support 4_194_304 / 142 = 29,537 readings
message UploadTelemetryRequest {
  // 1 byte tag + 2 byte length
  repeated TelemetryReading readings = 1;
}

// protoc reads msg definitions
message TelemetryReading {
  // 3 + 38 + 9 + 4 + 13 + 9 + 9 + 57 = 142 bytes

  // 1 byte tag + 1 byte len + 36 byte GUID string = 38 bytes
  string message_id = 1;

  // 1 byte tag + 1 byte len + 7 byte payload = 9 bytes
  string equipment_id = 2;

  // 1 byte tag + ~3 byte payload = 4 bytes
  int64 sequence_number = 3;

  // 1 byte tag + 1 byte len + 11 byte payload = 13 bytes
  google.protobuf.Timestamp occurred_at = 4;

  // 1 byte tag + 8 byte payload = 9 bytes
  double engine_temperature = 5;

  // 1 byte tag + 8 byte payload = 9 bytes
  double oil_pressure = 6;

  // 1 byte tag + 1 byte len + 55 byte payload = 57 bytes
  string traceparent = 7;
}

message TelemetryResponse {
  // 2 + 200 * 38 = 7,602 bytes

  // 1 byte tag + 1 byte payload = 2 bytes
  bool success = 1;

  // 1 byte tag + 1 byte len + 36 byte GUID string = 38 bytes each
  repeated string accepted_message_ids = 2;

  // 1 byte tag + 1 byte len + 36 byte GUID string = 38 bytes each
  repeated string rejected_message_ids = 3;
}

// Field numbers in this file are part of the wire contract. Add new fields with new numbers and
// reserve a number only when its deployed field is removed; the ingestion regression suite pins
// the current response tags so a future renumber cannot pass CI unnoticed.
