name: Terraform Validate

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/workflows/terraform-production-plan.yaml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/workflows/terraform-production-plan.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.0

      - name: Check formatting
        run: terraform fmt -check -recursive

      # Static validation downloads provider schemas but does not contact S3, Kubernetes, Kafka,
      # or Helm repositories. A real plan belongs in the protected environment that has access.
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color
