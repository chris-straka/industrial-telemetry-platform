# In .NET, Foo__Bar becomes Foo:Bar in code
services:
  # Generates a private development CA plus separate server/client leaf volumes. The CA private
  # key is never mounted into an application, and identities survive ordinary restarts.
  dev-pki-init:
    image: alpine:3.23
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - apk add --no-cache openssl >/dev/null && /usr/local/bin/create-dev-pki.sh
    volumes:
      - ./scripts/create-dev-pki.sh:/usr/local/bin/create-dev-pki.sh:ro
      - dev_pki_authority_data:/authority
      - ingestion_tls_data:/ingestion
      - edge_gateway_tls_data:/edge
      - sensor_tls_data:/sensors
      - kafka_tls_data:/kafka
      - kafka_clients_tls_data:/kafka-clients
      - postgres_tls_data:/postgres

  web-dashboard:
    image: node:24-alpine
    working_dir: /app
    # Mount your local source code so Vite sees changes
    volumes:
      - ./src/Industrial.Web.Dashboard:/app
      - dashboard_node_modules:/app/node_modules
    # Run the dev server and bind to all interfaces so Docker can expose it
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # This works for the dev server, but remember:
      # Vite bakes env vars at BUILD time for production
      - VITE_API_URL=http://localhost:5090

  web-api:
    image: web-api
    build:
      context: .
      dockerfile: src/Industrial.Web.Api/Dockerfile
    volumes:
      - kafka_tls_data:/kafka-tls:ro
      - kafka_clients_tls_data:/kafka-clients:ro
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__UseTls=true
      - Kafka__SslCaLocation=/kafka-tls/ca.crt
      - Kafka__SslCertificateLocation=/kafka-clients/webapi-client.crt
      - Kafka__SslKeyLocation=/kafka-clients/webapi-client.key
      - Kafka__GroupId=web-api-dashboard-group
      - Kafka__EventsTopic=telemetry-events
      - Kafka__AlertsTopic=telemetry-alerts
      - Kafka__ReadinessTimeoutSeconds=3
      - OTel__ServiceName=Industrial.Web.Api
      - OTel__Endpoint=http://otel-collector:4317
      - CORS__AllowedOrigins=http://localhost:3001,http://localhost:5173
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ingestion-api:
    image: ingestion-api
    build:
      context: .
      dockerfile: src/Industrial.Ingestion.Api/Dockerfile
    ports:
      # 8080 = REST/health (HTTP/1.1), 8081 = mutually authenticated gRPC (HTTPS/HTTP2).
      - "127.0.0.1:5089:8080"
      - "127.0.0.1:5091:8081"
    volumes:
      - ingestion_tls_data:/tls:ro
      - kafka_tls_data:/kafka-tls:ro
      - kafka_clients_tls_data:/kafka-clients:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__UseTls=true
      - Kafka__SslCaLocation=/kafka-tls/ca.crt
      - Kafka__SslCertificateLocation=/kafka-clients/ingestion-client.crt
      - Kafka__SslKeyLocation=/kafka-clients/ingestion-client.key
      - Kafka__EventsTopic=telemetry-events
      - Kafka__ReadinessTimeoutSeconds=3
      - Kestrel__Endpoints__Grpc__Url=https://+:8081
      - Kestrel__Endpoints__Grpc__Certificate__Path=/tls/server.pfx
      - Kestrel__Endpoints__Grpc__Certificate__Password=
      - TransportSecurity__Enabled=true
      - TransportSecurity__TrustedClientCaPath=/tls/ca.crt
      - TransportSecurity__AllowedClientFingerprintsPath=/tls/allowed-client-sha256.txt
      - OTel__ServiceName=Industrial.Ingestion.Api
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      dev-pki-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Sits between sensors and cloud
  #
  #  docker compose stop ingestion-api    # cloud dies; queue depth starts climbing
  #  docker compose restart edge-gateway  # gateway dies too; buffer survives on the volume
  #  docker compose start ingestion-api   # cloud returns; queue drains oldest-first
  #
  # then quiesce and audit the drained pipeline for duplicate IDs and observed gaps (make verify).
  edge-gateway:
    image: edge-gateway
    build:
      context: .
      dockerfile: src/Industrial.Sensor.EdgeGateway/Dockerfile
    ports:
      - "127.0.0.1:5272:8080"
      # Sensor mTLS listener, for manual demos with a device certificate.
      - "127.0.0.1:5273:8443"
    volumes:
      - edge_buffer_data:/data
      - edge_gateway_tls_data:/tls:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Points at the ingestion API's HTTP/2 port, not its REST port.
      - Cloud__ApiUrl=https://ingestion-api:8081
      - TransportSecurity__Enabled=true
      - TransportSecurity__ClientCertificatePath=/tls/client.pfx
      - TransportSecurity__ClientCertificatePassword=
      - TransportSecurity__TrustedServerCaPath=/tls/ca.crt
      # Sensor mTLS: per-device client certificates on a dedicated HTTPS listener.
      # Health and buffer inspection stay on plaintext :8080, which can no longer
      # accept readings once this is on.
      - SensorSecurity__Enabled=true
      - SensorSecurity__ServerCertificatePath=/tls/server.pfx
      - SensorSecurity__ServerCertificatePassword=
      - SensorSecurity__TrustedSensorCaPath=/tls/ca.crt
      - Buffer__Path=/data/edge-buffer.db
      - Buffer__MaxDepth=500000
      - Buffer__SettledIdRetentionHours=24
      - Buffer__QuarantineRetentionHours=168
      - Buffer__QuarantineMaxRows=10000
      - Uploader__BatchSize=200
      - Uploader__IdleDelayMs=500
      - Uploader__BaseBackoffSeconds=1
      - Uploader__MaxBackoffSeconds=30
      - Uploader__UploadTimeoutSeconds=30
      - OTel__ServiceName=Industrial.Sensor.EdgeGateway
      - OTel__Endpoint=http://otel-collector:4317
    # It waits only for its local identity material, never for the cloud.
    depends_on:
      dev-pki-init:
        condition: service_completed_successfully
    # Readiness proves the local durable queue is writable. Cloud reachability deliberately does
    # not affect it: accepting locally while the cloud is down is the gateway's purpose.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  diagnostics-worker:
    image: diagnostics-worker
    build:
      context: .
      dockerfile: src/Industrial.Diagnostics.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # VerifyFull against the dev CA the worker already mounts for Kafka, as the
      # non-superuser workload role. Plaintext TCP is rejected by pg_hba; host EF
      # tooling must use an SSL connection string (see `make db-update`).
      - ConnectionStrings__IndustrialDb=Host=postgres;Database=industrial_db;Username=diagnostics;Password=diagnostics-password;SSL Mode=VerifyFull;Root Certificate=/kafka-tls/ca.crt
      - Consumer__BaseBackoffSeconds=1
      - Consumer__MaxBackoffSeconds=30
      - Outbox__IdleDelayMs=500
      - Outbox__BaseBackoffSeconds=1
      - Outbox__MaxBackoffSeconds=30
      - Outbox__PublishedRetentionHours=168
      - Outbox__MaintenanceIntervalSeconds=30
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=gemini-flash-lite-latest
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__UseTls=true
      - Kafka__SslCaLocation=/kafka-tls/ca.crt
      - Kafka__SslCertificateLocation=/kafka-clients/diagnostics-client.crt
      - Kafka__SslKeyLocation=/kafka-clients/diagnostics-client.key
      - Kafka__GroupId=diagnostics-group
      - Kafka__EventsTopic=telemetry-events
      - Kafka__AlertsTopic=telemetry-alerts
      - Kafka__DeadLetterTopic=telemetry-events-dlq
      - Kafka__ReadinessTimeoutSeconds=3
      - OTel__ServiceName=Industrial.Diagnostics.Worker
      - OTel__Endpoint=http://otel-collector:4317
    volumes:
      - kafka_tls_data:/kafka-tls:ro
      - kafka_clients_tls_data:/kafka-clients:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sensor-emulator:
    image: sensor-emulator
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    volumes:
      - sensor_tls_data:/tls:ro
    environment:
      - Gateway__Url=https://edge-gateway:8443
      - Gateway__ClientCertificateDirectory=/tls
      - Gateway__TrustedSensorCaPath=/tls/ca.crt
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=0 # owns EQ-0..EQ-3
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  sensor-emulator-2:
    image: sensor-emulator
    profiles: [fleet]
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    volumes:
      - sensor_tls_data:/tls:ro
    environment:
      - Gateway__Url=https://edge-gateway:8443
      - Gateway__ClientCertificateDirectory=/tls
      - Gateway__TrustedSensorCaPath=/tls/ca.crt
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=1 # owns EQ-4..EQ-7
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  sensor-emulator-3:
    image: sensor-emulator
    profiles: [fleet]
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    volumes:
      - sensor_tls_data:/tls:ro
    environment:
      - Gateway__Url=https://edge-gateway:8443
      - Gateway__ClientCertificateDirectory=/tls
      - Gateway__TrustedSensorCaPath=/tls/ca.crt
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=2 # owns EQ-8..EQ-11
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  postgres:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_tls_data:/postgres-tls:ro
      - ./postgres/pg_hba.conf:/etc/pg-hba/pg_hba.conf:ro
    # The server key must be 0600 and owned by postgres, but the PKI volume is
    # root-owned and read-only. Stage the pair in a tls/ sibling of PGDATA on every
    # start (so rotation applies on restart): PGDATA itself must stay empty until
    # the stock entrypoint runs initdb.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/postgresql/tls && \
        cp /postgres-tls/server.crt /var/lib/postgresql/tls/server.crt && \
        cp /postgres-tls/server.key /var/lib/postgresql/tls/server.key && \
        chmod 0600 /var/lib/postgresql/tls/server.key && \
        chown -R postgres:postgres /var/lib/postgresql/tls && \
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key \
          -c hba_file=/etc/pg-hba/pg_hba.conf
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: industrial_db
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      dev-pki-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d industrial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Converges workload roles on every start (idempotent SQL), including databases
  # initialized before the roles existed. Runs after postgres is healthy and before
  # anything connects as a workload role.
  postgres-init:
    image: postgres:18
    volumes:
      - ./postgres/init-roles.sql:/init/init-roles.sql:ro
      - postgres_tls_data:/pg-tls:ro
    environment:
      PGPASSWORD: password
      POSTGRES_DIAGNOSTICS_PASSWORD: diagnostics-password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "host=postgres user=admin dbname=industrial_db sslmode=verify-full sslrootcert=/pg-tls/ca.crt" \
          -v diag_password="$$POSTGRES_DIAGNOSTICS_PASSWORD" \
          -v ON_ERROR_STOP=1 \
          -f /init/init-roles.sql
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.14
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - ./pgadmin/pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  kafka-storage-init:
    image: alpine:3.23
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - kafka_data:/data

  kafka:
    # Apache's official image is multi-architecture, so Apple silicon runs natively instead of
    # emulating Bitnami's amd64-only public image.
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is advertised to Compose services; EXTERNAL is advertised to host tools.
      # All three listeners terminate TLS. The controller quorum rides SSL too: with
      # the authorizer on, the broker must authenticate to the controller as its
      # superuser identity instead of arriving anonymous over plaintext. The dev
      # keystore password is the same class of placeholder as the Compose Postgres
      # password.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SSL,EXTERNAL:SSL,CONTROLLER:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SSL_KEYSTORE_LOCATION: /tls/kafka-server.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      # The broker verifies its own inter-broker connection at startup, so it needs
      # the CA truststore a client would carry.
      KAFKA_SSL_TRUSTSTORE_LOCATION: /tls/ca.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      # Client listeners require a certificate chained to the dev CA, and the
      # authorizer below turns that handshake identity into topic/group
      # permissions. The broker itself and the topic-setup admin stay superusers;
      # every workload principal gets only what its producer/consumer needs.
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # Kafka 4.x keeps the full DN (User:CN=kafka) under the default mapping, which
      # would force every ACL to carry the DN form. Map to the CN so principals read
      # as User:kafka, User:kafka-client-ingestion, and so on.
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?)$/$$1/,DEFAULT
      KAFKA_SUPER_USERS: User:kafka;User:kafka-client-admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_IS_CONFIGURED: "false"
      # Kafka's own Docker examples use this base64 UUID form for a stable KRaft cluster ID.
      CLUSTER_ID: abcdefghijklmnopqrstuv
      # Keep the previous Bitnami volume layout (`data/`) so changing images does not discard
      # an existing local broker log.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka
      - kafka_tls_data:/tls:ro
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
      kafka-truststore-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9094:9094" # Map external port (for Kafka UI tools on Mac)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tls/client.properties --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Imports the dev CA into a Java truststore with keytool. The openssl-minted files
  # all come from dev-pki-init; only this Java-native step needs the Kafka image.
  kafka-truststore-init:
    image: apache/kafka:4.2.0
    user: "0:0"
    volumes:
      - dev_pki_authority_data:/authority:ro
      - kafka_tls_data:/kafka
    depends_on:
      dev-pki-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        rm -f /kafka/ca.p12
        keytool -import -trustcacerts -alias dev-ca \
          -file /authority/ca.crt -keystore /kafka/ca.p12 \
          -storepass changeit -storetype PKCS12 -noprompt
        chmod 0444 /kafka/ca.p12

  kafka-init:
    image: apache/kafka:4.2.0
    volumes:
      - kafka_tls_data:/tls:ro
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    # Runs as the admin superuser over mTLS. ACLs are additive and this script is
    # the only writer, so re-running it on an existing broker only re-asserts the
    # same entries. Web-api consumer groups carry a per-host suffix, hence the
    # prefixed group pattern. No IDEMPOTENT_WRITE grant: kafka-acls.sh on this
    # broker version rejects it on CLUSTER, and a live idempotent produce as the
    # ingestion principal succeeds with topic WRITE+DESCRIBE alone.
    command:
      - |
        ACLS="/opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /tls/client.properties --add --allow-principal"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tls/client.properties --create --if-not-exists --topic telemetry-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tls/client.properties --create --if-not-exists --topic telemetry-alerts --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tls/client.properties --create --if-not-exists --topic telemetry-events-dlq --partitions 6 --replication-factor 1
        $$ACLS User:kafka-client-ingestion --operation WRITE --operation DESCRIBE --topic telemetry-events
        $$ACLS User:kafka-client-ingestion --operation DESCRIBE --cluster
        $$ACLS User:kafka-client-diagnostics --operation READ --operation DESCRIBE --topic telemetry-events
        $$ACLS User:kafka-client-diagnostics --operation WRITE --operation DESCRIBE --topic telemetry-alerts
        $$ACLS User:kafka-client-diagnostics --operation WRITE --operation DESCRIBE --topic telemetry-events-dlq
        $$ACLS User:kafka-client-diagnostics --operation DESCRIBE --cluster
        $$ACLS User:kafka-client-diagnostics --operation READ --group diagnostics-group
        $$ACLS User:kafka-client-webapi --operation READ --operation DESCRIBE --topic telemetry-events
        $$ACLS User:kafka-client-webapi --operation READ --operation DESCRIBE --topic telemetry-alerts
        $$ACLS User:kafka-client-webapi --operation DESCRIBE --cluster
        $$ACLS User:kafka-client-webapi --operation READ --group web-api-dashboard-group --resource-pattern-type prefixed
        $$ACLS User:kafka-client-ui --operation READ --operation DESCRIBE --topic telemetry-events
        $$ACLS User:kafka-client-ui --operation READ --operation DESCRIBE --topic telemetry-alerts
        $$ACLS User:kafka-client-ui --operation READ --operation DESCRIBE --topic telemetry-events-dlq
        $$ACLS User:kafka-client-ui --operation DESCRIBE --cluster

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kafka_tls_data:/tls:ro
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      # The UI is a read-only observer here with its own client identity.
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=SSL
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION=/tls/ca.p12
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD=changeit
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE=PKCS12
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION=/tls/ui-client.p12
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD=changeit
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD=changeit
    depends_on:
      kafka:
        condition: service_healthy

  # Collector receives telemetry from the services and exports it to the configured backends,
  # keeping backend-specific details out of application code.
  otel-collector:
    # "Contrib" version includes the extra plugins needed to talk to Prometheus and Kafka
    image: otel/opentelemetry-collector-contrib:0.151.0
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8889:8889" # Prometheus exporter port

  # The observability images run as distinct non-root users. Named volumes are initially owned
  # by root, so prepare them once before the backends try to create their data directories.
  observability-storage-init:
    image: alpine:3.23
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        chown -R 10001:10001 /loki /tempo
        chown -R 472:0 /grafana
        chown -R 65534:65534 /prometheus /alertmanager
    volumes:
      - loki_data:/loki
      - tempo_data:/tempo
      - grafana_data:/grafana
      - prometheus_data:/prometheus
      - alertmanager_data:/alertmanager

  loki:
    image: grafana/loki:3.7.2
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.11.3
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yaml:/etc/prometheus/rules/industrial-platform.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Demo retention budget: two weeks or two gigabytes, whichever binds first.
    # This is a disk ceiling for local history, not a production backup policy.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully

  # Receives Prometheus alerts and emails them to the local MailHog inbox.
  # Clustering is disabled: a single demo instance has no peers to gossip with.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully

  # Local SMTP sink and inbox UI for Alertmanager mail. The operator reads
  # firing alerts at http://localhost:8025; nothing leaves this machine.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"

  tempo:
    image: grafana/tempo:3.0.2
    ports:
      - "127.0.0.1:3200:3200"
      # 4317 host port removed to avoid conflict with OTel Collector
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./monitoring/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/industrial-platform.yaml:ro
      - ./monitoring/grafana-dashboard-industrial-platform.json:/var/lib/grafana/dashboards/industrial-platform.json:ro
      - grafana_data:/var/lib/grafana/data
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_PATHS_DATA=/var/lib/grafana/data
      # The provisioned dashboard uses built-in data sources only; do not download optional
      # catalog apps during startup of this reproducible local stack.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    depends_on:
      observability-storage-init:
        condition: service_completed_successfully

volumes:
  dashboard_node_modules:
  postgres_data:
  edge_buffer_data:
  kafka_data:
  loki_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  alertmanager_data:
  sensor_tls_data:
  kafka_tls_data:
  kafka_clients_tls_data:
  postgres_tls_data:
  dev_pki_authority_data:
  ingestion_tls_data:
  edge_gateway_tls_data:
