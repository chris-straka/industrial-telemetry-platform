# In .NET, Foo__Bar becomes Foo:Bar in code
services:
  web-dashboard:
    image: node:24-alpine
    working_dir: /app
    # Mount your local source code so Vite sees changes
    volumes:
      - ./src/Industrial.Web.Dashboard:/app
      - /app/node_modules
    # Run the dev server and bind to all interfaces so Docker can expose it
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # This works for the dev server, but remember:
      # Vite bakes env vars at BUILD time for production
      - VITE_API_URL=http://localhost:5090

  web-api:
    image: web-api
    build:
      context: .
      dockerfile: src/Industrial.Web.Api/Dockerfile
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=web-api-dashboard-group
      - Kafka__EventsTopic=telemetry-events
      - Kafka__AlertsTopic=telemetry-alerts
      - Kafka__ReadinessTimeoutSeconds=3
      - OTel__ServiceName=Industrial.Web.Api
      - OTel__Endpoint=http://otel-collector:4317
      - CORS__AllowedOrigins=http://localhost:3001,http://localhost:5173
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ingestion-api:
    image: ingestion-api
    build:
      context: .
      dockerfile: src/Industrial.Ingestion.Api/Dockerfile
    ports:
      # 8080 = REST (HTTP/1.1), 8081 = gRPC (HTTP/2 cleartext).
      # Two ports because there is no TLS here, so ALPN cannot negotiate the protocol
      # and each endpoint has to declare it. See Kestrel config in appsettings.json.
      - "127.0.0.1:5089:8080"
      - "127.0.0.1:5091:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__EventsTopic=telemetry-events
      - Kafka__ReadinessTimeoutSeconds=3
      - OTel__ServiceName=Industrial.Ingestion.Api
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Sits between sensors and cloud
  #
  #  docker compose stop ingestion-api    # cloud dies; queue depth starts climbing
  #  docker compose restart edge-gateway  # gateway dies too; buffer survives on the volume
  #  docker compose start ingestion-api   # cloud returns; queue drains oldest-first
  #
  # then check produced == ingested and duplicates == 0 (make verify).
  edge-gateway:
    image: edge-gateway
    build:
      context: .
      dockerfile: src/Industrial.Sensor.EdgeGateway/Dockerfile
    ports:
      - "127.0.0.1:5272:8080"
    volumes:
      - edge_buffer_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Points at the ingestion API's HTTP/2 port, not its REST port.
      - Cloud__ApiUrl=http://ingestion-api:8081
      - Buffer__Path=/data/edge-buffer.db
      - Buffer__MaxDepth=500000
      - Buffer__SettledIdRetentionHours=24
      - Buffer__QuarantineRetentionHours=168
      - Buffer__QuarantineMaxRows=10000
      - Uploader__BatchSize=200
      - Uploader__IdleDelayMs=500
      - Uploader__BaseBackoffSeconds=1
      - Uploader__MaxBackoffSeconds=30
      - Uploader__UploadTimeoutSeconds=30
      - OTel__ServiceName=Industrial.Sensor.EdgeGateway
      - OTel__Endpoint=http://otel-collector:4317
    # no depends_on because gateway is meant to work without the cloud
    # Readiness proves the local durable queue is writable. Cloud reachability deliberately does
    # not affect it: accepting locally while the cloud is down is the gateway's purpose.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  diagnostics-worker:
    image: diagnostics-worker
    build:
      context: .
      dockerfile: src/Industrial.Diagnostics.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IndustrialDb=Host=postgres;Database=industrial_db;Username=admin;Password=password
      - Consumer__BaseBackoffSeconds=1
      - Consumer__MaxBackoffSeconds=30
      - Outbox__IdleDelayMs=500
      - Outbox__BaseBackoffSeconds=1
      - Outbox__MaxBackoffSeconds=30
      - Outbox__PublishedRetentionHours=168
      - Outbox__MaintenanceIntervalSeconds=30
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=gemini-flash-lite-latest
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=diagnostics-group
      - Kafka__EventsTopic=telemetry-events
      - Kafka__AlertsTopic=telemetry-alerts
      - Kafka__DeadLetterTopic=telemetry-events-dlq
      - Kafka__ReadinessTimeoutSeconds=3
      - OTel__ServiceName=Industrial.Diagnostics.Worker
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sensor-emulator:
    image: sensor-emulator
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    environment:
      - Gateway__Url=http://edge-gateway:8080
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=0 # owns EQ-0..EQ-3
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  sensor-emulator-2:
    image: sensor-emulator
    profiles: [fleet]
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    environment:
      - Gateway__Url=http://edge-gateway:8080
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=1 # owns EQ-4..EQ-7
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  sensor-emulator-3:
    image: sensor-emulator
    profiles: [fleet]
    build:
      context: .
      dockerfile: src/Industrial.Sensor.Emulator/Dockerfile
    environment:
      - Gateway__Url=http://edge-gateway:8080
      - Emulator__DeviceCount=4
      - Emulator__IntervalSeconds=2
      - Emulator__BufferCapacity=10000
      - Emulator__ReplicaId=2 # owns EQ-8..EQ-11
      - OTel__ServiceName=Industrial.Sensor.Emulator
      - OTel__Endpoint=http://otel-collector:4317
    depends_on:
      edge-gateway:
        condition: service_healthy

  postgres:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: industrial_db
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d industrial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - ./pgadmin/pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  kafka-storage-init:
    image: alpine:3.23
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - kafka_data:/data

  kafka:
    # Apache's official image is multi-architecture, so Apple silicon runs natively instead of
    # emulating Bitnami's amd64-only public image.
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is advertised to Compose services; EXTERNAL is advertised to host tools.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Kafka's own Docker examples use this base64 UUID form for a stable KRaft cluster ID.
      CLUSTER_ID: abcdefghijklmnopqrstuv
      # Keep the previous Bitnami volume layout (`data/`) so changing images does not discard
      # an existing local broker log.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9094:9094" # Map external port (for Kafka UI tools on Mac)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry-alerts --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry-events-dlq --partitions 6 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Collector receives telemetry from the ingetstion API and worker and aggregates it
  # It then sends the data to backends like prometheus and jaegar (decouples code from monitoring tools)
  otel-collector:
    # "Contrib" version includes the extra plugins needed to talk to Prometheus and Kafka
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8889:8889" # Prometheus exporter port

  loki:
    image: grafana/loki:main-8703b0c
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"

  tempo:
    image: grafana/tempo:latest
    ports:
      - "127.0.0.1:3200:3200"
      # 4317 host port removed to avoid conflict with OTel Collector
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

volumes:
  postgres_data:
  edge_buffer_data:
  kafka_data:
